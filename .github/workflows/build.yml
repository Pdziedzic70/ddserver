name: Build ddserver
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd curl

      - name: Download SDK and build ddserver
        run: |
          BASE_URL="https://openwrt.org"
          SDK_FILE=$(curl -s "$BASE_URL" | grep -oE 'openwrt-sdk-[^"]+\.tar\.(xz|zst)' | head -n 1)
          echo "Downloading: $SDK_FILE"
          wget -q "${BASE_URL}${SDK_FILE}"
          tar -xf "$SDK_FILE"
          cd openwrt-sdk-*
          
          git clone https://github.com package/ddserver
          sed -i '1i #include <cstring>\n#include <unistd.h>' package/ddserver/src/*.cpp package/ddserver/src/*.h 2>/dev/null || true
          
          ./scripts/feeds update base
          ./scripts/feeds install libusb-1.0
          make defconfig
          echo "CONFIG_PACKAGE_ddserver=y" >> .config
          make defconfig
          make package/ddserver/compile V=s TARGET_CXXFLAGS+="-fpermissive -w" TARGET_CFLAGS+="-w"
          
          find bin/ -name "ddserver_*.ipk" -exec cp {} "$GITHUB_WORKSPACE/" \;

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ddserver-ipk
          path: ddserver_*.ipk
